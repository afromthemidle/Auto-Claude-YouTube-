services:
  - type: web
    name: vegetarian-podcast
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    plan: starter
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: YOUTUBE_CLIENT_SECRET_JSON
        sync: false
      - key: YOUTUBE_TOKEN_JSON
        sync: false
      - key: TTS_VOICE
        value: es-ES-AlvaroNeural
      - key: TTS_RATE
        value: "-5%"
      - key: TTS_VOLUME
        value: "+10%"
      - key: YOUTUBE_CATEGORY_ID
        value: "22"
      - key: YOUTUBE_PRIVACY
        value: public
      - key: SCHEDULE_HOUR
        value: "23"
      - key: SCHEDULE_MINUTE
        value: "20"
      - key: SERVER_HOST
        value: "0.0.0.0"
      - key: SERVER_PORT
        value: "10000"
    disk:
      name: podcast-data
      mountPath: /opt/render/project/src
      sizeGB: 1
