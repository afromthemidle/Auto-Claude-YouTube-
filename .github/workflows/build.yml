name: Build & Release APK

on:
  push:
    branches: [ "claude/android-recipe-app-Pdv6c", "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            tools
            platform-tools
            build-tools;34.0.0
            platforms;android-34

      - name: Aceptar licencias del SDK
        run: yes | sdkmanager --licenses || true

      - name: Hacer ejecutable gradlew
        run: chmod +x ./gradlew

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: RecipeDiet-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Info del APK generado
        run: |
          echo "✅ Build exitoso"
          ls -lh app/build/outputs/apk/debug/

  release:
    name: Build Release APK
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: build

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            tools
            platform-tools
            build-tools;34.0.0
            platforms;android-34

      - name: Aceptar licencias del SDK
        run: yes | sdkmanager --licenses || true

      - name: Hacer ejecutable gradlew
        run: chmod +x ./gradlew

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Compilar APK Release (sin firma)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Subir APK Release como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: RecipeDiet-Release-APK
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 90
